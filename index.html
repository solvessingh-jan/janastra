<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Janastra - Citizen Reporting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="particles" id="particles"></div>

  <div class="hero">
    <div class="hero-glass"></div>
    <div class="hero-content">
      <h1>🏛️ Janastra</h1>
      <p>Your voice. One click. Real change.</p>
      <button class="cta-btn" onclick="document.querySelector('.container').scrollIntoView({behavior: 'smooth'})">
        <span style="position: relative; z-index: 1;">Start Reporting</span>
      </button>
    </div>
    <div class="scroll-indicator">
      <svg width="30" height="50" viewBox="0 0 30 50">
        <rect x="5" y="5" width="20" height="40" rx="10" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
        <circle cx="15" cy="15" r="3" fill="rgba(255,255,255,0.8)">
          <animate attributeName="cy" from="15" to="30" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" from="1" to="0" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </svg>
    </div>
  </div>

  <main class="container">
    <h2 class="section-title">Report. Track. Transform.</h2>

    <div class="tabs">
      <button class="tab active" data-tab="water">💧 Water</button>
      <button class="tab" data-tab="civic">🏠 Civic</button>
      <button class="tab" data-tab="traffic">🚦 Traffic</button>
      <button class="tab" data-tab="scam">🚨 Scam</button>
      <button class="tab" data-tab="clinics">🏥 Clinics</button>
    </div>

    <section id="water" class="form-section active">
      <h2>Water Availability</h2>
      <div class="input-group">
        <input id="water_area" placeholder="Enter area/locality (e.g., Karol Bagh)" />
      </div>
      <div class="input-group">
        <input id="water_status" placeholder="No water / Low pressure / Normal" />
      </div>
      <button class="submit-btn" onclick="submitWater()">📤 Submit Report</button>
    </section>

    <section id="civic" class="form-section">
      <h2>Civic Issues</h2>
      <div class="input-group">
        <input id="civic_area" placeholder="Area/Locality" />
      </div>
      <div class="input-group">
        <input id="civic_category" placeholder="Garbage, Streetlight, Drainage etc." />
      </div>
      <div class="input-group">
        <textarea id="civic_desc" placeholder="Brief description of problem" rows="3"></textarea>
      </div>
      <button class="submit-btn" onclick="submitCivic()">📤 Submit Complaint</button>
    </section>

    <section id="traffic" class="form-section">
      <h2>Traffic Updates</h2>
      <div class="input-group">
        <input id="traffic_area" placeholder="Area/Road name" />
      </div>
      <div class="input-group">
        <input id="traffic_issue" placeholder="Traffic jam, Accident, Pothole etc." />
      </div>
      <button class="submit-btn" onclick="submitTraffic()">📤 Report Issue</button>
    </section>

    <section id="scam" class="form-section">
      <h2>Scam Alerts</h2>
      <div class="input-group">
        <input id="scam_area" placeholder="Your area" />
      </div>
      <div class="input-group">
        <textarea id="scam_desc" placeholder="Call/SMS/UPI scam details" rows="3"></textarea>
      </div>
      <button class="submit-btn" onclick="submitScam()">🚨 Report Scam</button>
    </section>

    <section id="clinics" class="form-section">
      <h2>Find Clinics</h2>
      <div class="input-group">
        <input id="clinic_area" placeholder="Enter your area/locality" />
      </div>
      <button class="submit-btn" onclick="loadClinics()">🔍 Load Clinics Nearby</button>
    </section>

    <div id="output" class="output">Ready to help your community...</div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-number" id="stat1">0</div>
        <div class="stat-label">Reports Submitted</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat2">0</div>
        <div class="stat-label">Issues Resolved</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat3">0</div>
        <div class="stat-label">Active Citizens</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
