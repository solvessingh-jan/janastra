<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Janastra AI - Hyper Civic Network</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <!-- Google Maps + Futuristic APIs -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_KEY&libraries=places&callback=initMap"></script>
</head>
<body>
  <!-- Neural HUD -->
  <div class="hud">
    <div class="status-bar">
      <span id="location">🛰️ Locating...</span>
      <span id="ai-status">🤖 AI Online</span>
    </div>
  </div>

  <!-- 3D Globe Dashboard -->
  <div id="globe-container">
    <canvas id="globe"></canvas>
    <div class="globe-overlay">
      <h1 class="neon-title">JANASTRA AI</h1>
      <p class="neon-subtitle">Global Civic Intelligence Network</p>
    </div>
  </div>

  <!-- Hyper Form Tabs -->
  <main class="hyper-container">
    <div class="neural-tabs">
      <button class="tab neural-btn active" data-tab="water">💧 H2O</button>
      <button class="tab neural-btn" data-tab="civic">🏠 CIVIC</button>
      <button class="tab neural-btn" data-tab="traffic">🚦 FLOW</button>
      <button class="tab neural-btn" data-tab="scam">🚨 THREAT</button>
      <button class="tab neural-btn" data-tab="clinics">🏥 MED</button>
    </div>

    <!-- Auto-filled forms with AI -->
    <section id="water" class="hyper-form active">
      <div class="ai-input-group">
        <input id="water_area" placeholder="AI: Detecting location..." />
        <button class="locate-btn" onclick="getCurrentLocation()">📍 AUTO-LOCATE</button>
      </div>
      <input id="water_status" placeholder="Issue severity" />
      <button class="hyper-submit" onclick="submitWater()">🚀 TRANSMIT</button>
    </section>

    <!-- Other forms similar structure... -->
    <section id="clinics" class="hyper-form">
      <input id="clinic_area" placeholder="AI will auto-search nearby clinics" />
      <button class="locate-btn" onclick="findNearbyClinics()">🩺 MAP SEARCH</button>
    </section>

    <div id="output" class="quantum-output">Initializing neural network...</div>
  </main>

  <!-- WebGL + Particles + Voice -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
