<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Janastra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Janastra</h1>

<hr>

<h2>Submit Water Report</h2>
<input id="waterArea" placeholder="Area / Locality" />
<input id="waterStatus" placeholder="Water status (No / Low / Normal)" />
<button id="submitWater">Submit Water Report</button>

<hr>

<h2>Submit Civic Complaint</h2>
<input id="civicArea" placeholder="Area / Locality" />
<input id="civicCategory" placeholder="Issue (Garbage / Streetlight)" />
<input id="civicDesc" placeholder="Short description" />
<button id="submitCivic">Submit Civic Complaint</button>

<hr>

<h2>Submit Traffic Report</h2>
<input id="trafficArea" placeholder="Area / Locality" />
<input id="trafficIssue" placeholder="Traffic issue" />
<button id="submitTraffic">Submit Traffic Report</button>

<hr>

<h2>Report a Scam</h2>
<input id="scamArea" placeholder="Area / Platform" />
<input id="scamDesc" placeholder="Scam description" />
<button id="submitScam">Submit Scam Report</button>

<hr>

<h2>Add Clinic</h2>
<input id="clinicName" placeholder="Clinic name" />
<input id="clinicArea" placeholder="Area" />
<input id="clinicType" placeholder="Govt / Private" />
<button id="submitClinic">Add Clinic</button>

<hr>

<pre id="output"></pre>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
