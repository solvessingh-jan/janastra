<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Janastra</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>Janastra</h1>

  <!-- Action Buttons -->
  <button id="waterBtn">Water Report</button>
  <button id="civicBtn">Civic Complaint</button>

  <!-- WATER REPORT -->
  <h3>Submit Water Report</h3>
  <input id="areaInput" placeholder="Area / Locality" />
  <br /><br />
  <input id="statusInput" placeholder="Water status (No / Low / Normal)" />
  <br /><br />
  <button id="submitWater">Submit Water Report</button>

  <hr style="margin:30px 0;" />

  <!-- CIVIC COMPLAINT -->
  <h3>Submit Civic Complaint</h3>
  <input id="civicArea" placeholder="Area / Locality" />
  <br /><br />
  <input id="civicType" placeholder="Issue (Garbage / Streetlight / Road)" />
  <br /><br />
  <input id="civicDesc" placeholder="Short description" />
  <br /><br />
  <button id="submitCivic">Submit Civic Complaint</button>

  <!-- OUTPUT -->
  <pre id="content" style="margin-top:20px;"></pre>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- APP -->
  <script src="app.js"></script>
</body>
</html>
